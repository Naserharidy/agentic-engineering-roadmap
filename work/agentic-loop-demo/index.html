<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agentic Loop Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Agentic Loop Demo</h1>
    <p>A small responsive webpage that shows a message when you click the button.</p>
    <button type="button" id="demoBtn">Show Message</button>
    <p id="message" class="message hidden">
      The agentic loop is working: click → action → feedback.
    </p>
  </main>
  <script src="script.js"></script>
</body>
</html>
